<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinpaş Tasarruf Sandığı - Kart Eşleştirme Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <!-- Changed to use the user-provided logo -->
            <img src="assets/sinpas_logo.png" alt="Sinpaş Logo" id="logo">
        </header>

        <div id="instruction">
            Kartları eşleştirin,<br>
            <strong>Size uygun ödeme seçenekleri ile ev ya da araç sahibi olun!</strong>
        </div>

        <div id="timer">02:00</div>

        <div id="grid">
            <!-- Cards will be generated by JS -->
        </div>

        <div id="end-screen" class="hidden">
            <div class="content">
                <h2>Tebrikler!</h2>
                <p>Kartları başarıyla eşleştirdiniz.</p>
                <a href="https://www.sinpasyts.com/arabalanding/?utm_source=criteo-araba-crmmedya&utm_medium=display-banner&utm_campaign=yeni-arac-alacaklara-mujde-beklenen-destek-yeni-bordo-tablo&cto_pld=h2LsmVfFAQB8L6mJmIywcQ" target="_blank" class="cta-button">Fırsatları İncele</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
